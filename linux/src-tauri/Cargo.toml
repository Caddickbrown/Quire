[package]
name = "nook"
version = "0.1.0"
description = "Nook — a distraction-free markdown journal (Linux)"
authors = ["Daniel Caddick-Brown"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# IANA zone names, so a Day One export's per-entry `timeZone` lands on the day
# it was actually written (the Swift importer uses Foundation's TimeZone).
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
