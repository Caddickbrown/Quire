[package]
name = "quire-desktop"
version = "0.9.1"
description = "Quire prototype: one journalling app over a jnl folder"
edition = "2021"

[lib]
name = "quire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quire-core = { path = "../../core" }
arboard.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Only the AppImage updater is used, so not the zip feature (Windows/macOS).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
dirs = "5"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Matches the glib wry/tao pull in; only for set_prgname.
glib = "0.18"
