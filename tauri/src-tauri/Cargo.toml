[package]
name = "wander"
version = "0.1.0"
description = "A journal that writes plain markdown"
authors = ["Caddickbrown"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
