[workspace]
resolver = "2"
members = ["core", "tui", "linux/src-tauri", "bindings"]
default-members = ["core", "tui"]

[workspace.package]
version = "0.10.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Caddickbrown/Quire"

[workspace.dependencies]
quire-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
chrono = "0.4"
chrono-tz = "0.10"
tempfile = "3"
dirs = "5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp"] }
# The clipboard, for image paste (Linux app and terminal).
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[profile.release]
strip = true
lto = "thin"

[profile.dev.package."*"]
opt-level = 3
