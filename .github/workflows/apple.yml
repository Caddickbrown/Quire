name: Apple
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apple/**'
      - 'bindings/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/apple.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust XCFramework, macOS app and iOS Simulator app
        run: make apple
      - name: Run hostless Swift tests against the Rust core
        run: >-
          xcodebuild -project apple/Quire.xcodeproj -scheme Quire
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO test
