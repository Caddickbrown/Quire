name: Apple
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apple/**'
      - 'bindings/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/apple.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-11-09
      - name: Build Rust XCFramework, macOS app and iOS Simulator app
        run: make apple
      - name: Run hostless Swift tests against the Rust core
        run: >-
          xcodebuild -project apple/Quire.xcodeproj -scheme Quire
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO test
