name: CI
# The checks CLAUDE.md asks for before a push: make test, make check and
# make smoke. It does not run on a push. It runs when asked (Actions → CI →
# Run workflow, or `gh workflow run ci.yml`), and release.yml calls it on a
# release tag and publishes nothing if it fails. Between releases the three
# commands are run by hand.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'What to check out; empty for the commit that triggered the run'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # A shared runner is a busy host; see the note on make smoke in CLAUDE.md.
      QUIRE_SMOKE_WAIT_SCALE: 3
      # A check this runner can't run (no node, WebKitGTK or shellcheck) fails
      # the job instead of being skipped: see `skip` in the Makefile.
      QUIRE_CHECK_STRICT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-11-09
        with:
          components: clippy
      # The desktop crate is linted and its tests run only where WebKitGTK is
      # installed; the same list as release.yml's desktop job.
      - name: System libraries for the desktop app
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - run: make test
      - run: make check
      - run: make smoke
