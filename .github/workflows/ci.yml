name: CI
# The checks CLAUDE.md asks for before a push: make test, make check and
# make smoke. It does not run on a push. It runs when asked (Actions → CI →
# Run workflow, or `gh workflow run ci.yml`), and release.yml calls it on a
# release tag and publishes nothing if it fails. Between releases the three
# commands are run by hand.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'What to check out; empty for the commit that triggered the run'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # A shared runner is a busy host; see the note on make smoke in CLAUDE.md.
      QUIRE_SMOKE_WAIT_SCALE: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-11-09
        with:
          components: clippy
      - run: make test
      - run: make check
      - run: make smoke
