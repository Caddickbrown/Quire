name: Release
# Titled after the tag: by default a tag run takes its commit's message.
run-name: Release ${{ inputs.tag || github.ref_name }}
# Pushing a tag vX.Y.Z builds Linux x86_64 and aarch64 releases and publishes
# them on GitHub Releases: the terminal app (quire + jnl, one tarball per
# target, with a .sha256 beside it; macOS too, Apple silicon and Intel) and
# the desktop app (AppImage, .deb, .rpm; Linux only). With the TAURI_SIGNING_PRIVATE_KEY secret set, the AppImages and the
# terminal tarballs are signed (a .sig beside each) and latest.json lets the
# AppImage update itself. The key is seen by one job only, `sign`, which
# builds nothing. The tag must be on main. See "Releases" in CLAUDE.md for
# cutting one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to rebuild, e.g. v0.7.1'
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  # make test, make check and make smoke on the tag: nothing is built or
  # published if they fail.
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # All of history: the next step asks whether main contains the tag.
          fetch-depth: 0
      - name: The tag is on main
        # A tag on a branch, or on a commit that never reached main, publishes
        # nothing, whatever its version fields say.
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main \
            || { echo "::error::$TAG ($(git rev-parse --short HEAD)) is not on main: merge the release commit to main, then tag that commit"; exit 1; }
      - name: The tag matches every version field
        id: v
        run: |
          v=${TAG#v}
          ws=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tauri=$(jq -r .version linux/src-tauri/tauri.conf.json)
          npm=$(jq -r .version linux/package.json)
          desk=$(sed -n 's/^version = "\(.*\)"/\1/p' linux/src-tauri/Cargo.toml | head -1)
          echo "tag $v · Cargo.toml $ws · tauri.conf.json $tauri · package.json $npm · quire-desktop $desk"
          for x in "$ws" "$tauri" "$npm" "$desk"; do
            [ "$x" = "$v" ] || { echo "::error::$TAG doesn't match every version field (see above)"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## [${TAG#v}]' section"; exit 1; }
      - name: The CHANGELOG heading is dated
        # "## [x.y.z] — YYYY-MM-DD" exactly: a section still headed "not yet
        # released", or one left under [Unreleased], publishes nothing.
        run: |
          v=${TAG#v}
          head=$(awk -v v="$v" 'index($0, "## [" v "]") == 1 { print; exit }' CHANGELOG.md)
          case "$head" in
            "## [$v] — "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) echo "$head" ;;
            *) echo "::error::CHANGELOG.md's heading for $v is '$head'; it must be '## [$v] — YYYY-MM-DD'"; exit 1 ;;
          esac
          # Bullets still under [Unreleased] would be left out of the notes.
          left=$(awk '/^## \[/ { on = ($0 == "## [Unreleased]"); next } on && /^- /' CHANGELOG.md | wc -l)
          [ "$left" -eq 0 ] || { echo "::error::$left bullet(s) are still under [Unreleased]: fold them into [$v] before tagging"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md

  terminal:
    needs: [verify, check]
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          # Both Mac builds on Apple silicon; the Intel one is cross-compiled.
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-11-09
        with:
          targets: ${{ matrix.target }}
      - name: Build quire and jnl
        env:
          QUIRE_RELEASE_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --locked -p quire-tui --target ${{ matrix.target }}
      - name: Package
        run: |
          name=quire-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/quire target/${{ matrix.target }}/release/jnl README.md CHANGELOG.md "$name/"
          # Run where it can: not the Intel build on an Apple silicon runner.
          case "${{ matrix.target }}" in "$(uname -m | sed 's/arm64/aarch64/')"-*) "$name/quire" --version ;; esac
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-${{ matrix.target }}
          path: quire-${{ matrix.target }}.tar.gz*

  desktop:
    needs: [verify, check]
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-11-09
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Front-end dependencies
        working-directory: linux
        run: npm ci --no-fund --no-audit
      # Built unsigned. The signing key is never in this job: the build runs
      # the build scripts and proc-macros of several hundred crates, and the
      # Tauri CLI. The `sign` job below signs the finished AppImage, which is
      # the file the updater downloads and checks.
      - name: Build the AppImage, .deb and .rpm
        working-directory: linux
        env:
          QUIRE_RELEASE: '1'
        run: npx tauri build --bundles appimage,deb,rpm
      - name: Collect
        run: |
          mkdir out
          b=target/release/bundle
          cp $b/appimage/*.AppImage $b/deb/*.deb $b/rpm/*.rpm out/
          (cd out && sha256sum * > ../SHA256SUMS-desktop-${{ matrix.arch }} && mv ../SHA256SUMS-desktop-${{ matrix.arch }} .)
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.arch }}
          path: out/*

  # The only job that holds the updater's signing key. It compiles nothing
  # and runs no build script: it downloads what the two build jobs made and
  # signs each AppImage and each terminal tarball with the Tauri CLI
  # (`tauri signer sign` writes <file>.sig, the format the updater reads:
  # base64 of a minisign signature). The CLI is installed with
  # --ignore-scripts, in a step that doesn't have the key.
  sign:
    needs: [verify, terminal, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: The Tauri CLI, as package-lock.json pins it
        working-directory: linux
        run: npm ci --no-fund --no-audit --ignore-scripts
      - name: Sign the AppImages and the terminal tarballs
        working-directory: linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir ../signatures
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::no TAURI_SIGNING_PRIVATE_KEY secret: nothing is signed, and the AppImage won't be able to update itself"
            exit 0
          fi
          [ -n "$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)" ] \
            || { echo "::error::the signing key is set but plugins.updater.pubkey in tauri.conf.json is empty"; exit 1; }
          n=0
          for f in ../dist/*.AppImage ../dist/quire-*.tar.gz; do
            [ -f "$f" ] || { echo "::error::nothing to sign matches $f"; exit 1; }
            npx tauri signer sign "$f" >/dev/null
            [ -s "$f.sig" ] || { echo "::error::no signature was written for $f"; exit 1; }
            mv "$f.sig" ../signatures/
            n=$((n + 1))
          done
          # Two AppImages (Linux) and four tarballs (Linux and macOS, each
          # x86_64 and aarch64).
          [ "$n" -eq 6 ] || { echo "::error::signed $n files, expected 6"; exit 1; }
          ls -l ../signatures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: signatures/*.sig
          if-no-files-found: ignore

  publish:
    needs: [verify, terminal, desktop, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: latest.json for the AppImage updater
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          platforms='{}'
          # Tauri names them Quire_<version>_amd64.AppImage / _aarch64.AppImage.
          for pair in x86_64:amd64 aarch64:aarch64; do
            arch=${pair%%:*}
            img=$(ls ./*_"${pair#*:}".AppImage 2>/dev/null | head -1); img=${img#./}
            [ -n "$img" ] && [ -f "$img.sig" ] || continue
            platforms=$(jq --arg k "linux-$arch" --arg sig "$(cat "$img.sig")" \
              --arg url "https://github.com/$REPO/releases/download/$TAG/$img" \
              '. + {($k): {signature: $sig, url: $url}}' <<<"$platforms")
          done
          if [ "$platforms" != '{}' ]; then
            jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg n "See https://github.com/$REPO/releases/tag/$TAG" --argjson p "$platforms" \
              '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
            cat latest.json
          fi
          mv notes.md ../notes.md
          ls -l
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" \
            --title "Quire $VERSION" --notes-file notes.md --verify-tag
