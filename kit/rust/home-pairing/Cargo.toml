[package]
name = "home-pairing"
version = "0.1.0"
edition = "2021"
description = "The pairing rules every home server shares (app-kit docs/DEVICES.md, section 1)"
publish = false

[dependencies]
sha2 = "0.10"
serde_json = { version = "1", optional = true }

[features]
# The /api/pair bookkeeping (src/book.rs), for servers. The rules alone need only sha2.
book = ["dep:serde_json"]

[dev-dependencies]
serde_json = "1"
