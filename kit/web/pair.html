<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devices</title>
<!-- The kit's approve page (docs/DEVICES.md section 2). A server serves this file as is at GET /pair;
     it talks to /api/pair/lookup, /api/pair/approve and /api/paired on the same origin. Signed in by the
     server's own cookie if it has one, otherwise by the main token typed here, kept for this tab only
     (sessionStorage) and sent as a Bearer header. Nothing here is specific to one service. -->
<style>
:root { --bg: #f6f5f2; --raised: #fff; --ink: #1d1c1a; --muted: #5f5c56; --rule: #d9d6cf; --accent: #2f5d50;
        --late: #a33a2b; --done: #2f6b3a; color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --raised: #22211f; --ink: #ecebe7; --muted: #a8a59e; --rule: #3a3835; --accent: #8cc4b2;
          --late: #f08a7a; --done: #8fd19b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.45 system-ui, -apple-system, sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
p { margin: .25rem 0 .75rem; }
.muted { color: var(--muted); }
.card { background: var(--raised); border: 1px solid var(--rule); border-radius: 12px; padding: 1rem; margin: .75rem 0; }
label { display: block; font-weight: 600; margin: .5rem 0 .25rem; }
input[type=text], input[type=password] { width: 100%; font: inherit; padding: .6rem .7rem; border-radius: 8px;
  border: 1px solid var(--rule); background: var(--bg); color: var(--ink); }
#code { font: 600 1.6rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .15em; text-transform: uppercase; }
button { font: inherit; font-weight: 600; padding: .55rem 1rem; border-radius: 8px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--bg); cursor: pointer; margin: .5rem .5rem 0 0; min-height: 44px; }
button.plain { background: transparent; color: var(--accent); }
button.danger { background: transparent; color: var(--late); border-color: var(--late); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
.say { padding: .6rem .8rem; border-radius: 8px; margin: .75rem 0; border: 1px solid var(--rule); }
.say.bad { border-color: var(--late); color: var(--late); }
.say.good { border-color: var(--done); color: var(--done); }
.scopes label { display: inline-flex; gap: .35rem; font-weight: 400; margin-right: 1rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem 1rem; margin: .5rem 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.revoked { opacity: .6; }
.fingerprint { font: 600 1.25rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .05em; margin: .35rem 0; }
.check { border-left: 3px solid var(--accent); padding-left: .75rem; margin: .75rem 0; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Devices</h1>
  <p class="muted">Approve a phone or gadget that's showing a pairing code, and see what's paired.</p>

  <section id="server" class="card" aria-labelledby="server-title">
    <strong id="server-title">This server's certificate</strong>
    <p id="fingerprint" class="fingerprint">…</p>
    <p id="fingerprint-say" class="muted"></p>
  </section>

  <section id="signin" class="card" hidden>
    <label for="token">Main token</label>
    <p class="muted">This server has no sign-in page, so type its main token. It's kept in this tab only.</p>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <button id="use-token" type="button">Sign in</button>
  </section>

  <section class="card">
    <label for="code">Code shown on the device</label>
    <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="7Q4-M2X">
    <button id="find" type="button">Find it</button>
    <div id="request" hidden>
      <dl id="request-facts"></dl>
      <p class="check" id="request-check"></p>
      <label for="name">Call it</label>
      <input id="name" type="text" maxlength="40">
      <div class="scopes" id="scopes"></div>
      <button id="approve" type="button">Pair</button>
      <button id="cancel" class="plain" type="button">Not this one</button>
    </div>
  </section>
  <div id="say" class="say" role="status" aria-live="polite" hidden></div>

  <h2>Paired</h2>
  <div id="list"><p class="muted">Loading…</p></div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const WORDS = { read: "Read", write: "Change", devices: "Approve other devices", display: "Show", touch: "Tap",
                sensor: "Send readings", voice: "Speak", record: "Record" };
let token = null;
try { token = sessionStorage.getItem("pair-token"); } catch (e) { /* private mode */ }
let found = null;
let serverCert = null;   // SHA-256 of this server's certificate, from /.well-known/pair

// The first 16 hex characters in four groups: what the phone shows under its code.
function shortHash(hex) {
  if (!hex || hex.length < 16) return null;
  return [0, 4, 8, 12].map((i) => hex.slice(i, i + 4)).join(" ");
}

// What to check before pressing Pair. A device on the Wi-Fi can pass a phone's request on to this
// server, so the phone's code alone doesn't prove which phone asked: its certificate and address do.
function checkWords() {
  const short = shortHash(serverCert);
  if (short) return `Before you press Pair: the phone must show certificate ${short} and this request must be from the phone's own address (it shows it under the code). If either differs, choose "Not this one".`;
  return `Before you press Pair: check "From" is the phone's own address (it shows it under the code). If it differs, choose "Not this one".`;
}

function showServer() {
  const short = shortHash(serverCert);
  $("fingerprint").textContent = short || (location.protocol === "http:" ? "none (plain http)" : "not given");
  $("fingerprint-say").textContent = short
    ? "A phone pairing with this server shows the same four groups under its code. If it shows anything else, something on the Wi-Fi is in between: don't pair it."
    : location.protocol === "http:"
      ? "This server uses plain http, so there's no certificate to compare. Check the request comes from the phone's own address instead."
      : "This server doesn't say its certificate's fingerprint. Check the request comes from the phone's own address instead.";
}

function say(text, tone) {
  const el = $("say");
  el.textContent = text; el.className = "say " + (tone || ""); el.hidden = !text;
}

async function call(path, body) {
  const headers = { "Accept": "application/json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = "Bearer " + token;
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST", headers, credentials: "same-origin",
                                body: body === undefined ? undefined : JSON.stringify(body) });
  let data = {};
  try { data = await r.json(); } catch (e) { /* not JSON */ }
  if (r.status === 401) { $("signin").hidden = false; }
  return { status: r.status, data };
}

function when(iso) {
  if (!iso) return "never";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}

async function load() {
  const r = await call("/api/paired");
  const list = $("list");
  if (r.status !== 200) {
    list.innerHTML = "";
    const p = document.createElement("p"); p.className = "muted";
    p.textContent = r.status === 401 ? "Sign in to see what's paired." : (r.data.error || "Couldn't load the list.");
    list.append(p);
    return;
  }
  $("signin").hidden = true;
  list.innerHTML = "";
  if (r.data.locked) say("Too many wrong codes. Code entry is paused for ten minutes.", "bad");
  if (!r.data.paired.length) {
    const p = document.createElement("p"); p.className = "muted"; p.textContent = "Nothing is paired yet.";
    list.append(p);
  }
  for (const d of r.data.paired) {
    const card = document.createElement("div");
    card.className = "card" + (d.revoked_at ? " revoked" : "");
    const top = document.createElement("div"); top.className = "row";
    const h = document.createElement("strong"); h.textContent = d.name || d.title;
    const s = document.createElement("span"); s.className = "muted";
    s.textContent = d.revoked_at ? "Removed " + when(d.revoked_at) : (d.online ? "Online now" : "Last seen " + when(d.last_seen));
    top.append(h, s);
    const facts = document.createElement("dl");
    for (const [k, v] of [["Kind", [d.title, d.model].filter(Boolean).join(" · ")], ["Key", d.key],
                          ["Can", d.scopes.map((x) => WORDS[x] || x).join(", ")], ["Paired", when(d.paired_at) + (d.approved_by ? " by " + d.approved_by : "")],
                          ["Last address", d.last_ip || "none yet"]]) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      facts.append(dt, dd);
    }
    card.append(top, facts);
    const act = (label, cls, path, done) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (cls) b.className = cls;
      b.onclick = async () => {
        const res = await call(path, {});
        if (res.status === 200) { say(done, "good"); } else { say(res.data.error || "That didn't work.", "bad"); }
        load();
      };
      card.append(b);
    };
    if (d.revoked_at) {
      act("Restore", "plain", `/api/paired/${d.id}/restore`, `${d.name} can connect again.`);
      act("Remove now", "danger", `/api/paired/${d.id}/remove`, `${d.name} is gone from the list.`);
    } else {
      act("Revoke", "danger", `/api/paired/${d.id}/revoke`, `${d.name}'s key stopped working. Restore puts it back.`);
    }
    list.append(card);
  }
}

async function find() {
  say("");
  const r = await call("/api/pair/lookup", { code: $("code").value });
  if (r.status !== 200) { $("request").hidden = true; say(r.data.error || "That didn't work.", "bad"); return; }
  found = r.data.request;
  const facts = $("request-facts"); facts.innerHTML = "";
  for (const [k, v] of [["Asking", [found.title, found.model].filter(Boolean).join(" · ")], ["Says it's", found.name || "no name"],
                        ["From", found.ip + " (should be the phone's own address)"], ["Asked", when(found.asked_at)], ["Code runs out in", Math.max(0, Math.round(found.expires_in / 60)) + " min"]]) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    facts.append(dt, dd);
  }
  $("request-check").textContent = checkWords();
  $("name").value = found.name || "";
  const box = $("scopes"); box.innerHTML = "";
  for (const s of found.ceiling) {
    const l = document.createElement("label");
    const c = document.createElement("input"); c.type = "checkbox"; c.value = s; c.checked = found.default.includes(s);
    l.append(c, document.createTextNode(WORDS[s] || s));
    box.append(l);
  }
  $("request").hidden = false;
  $("name").focus();
}

async function approve() {
  const scopes = [...document.querySelectorAll("#scopes input:checked")].map((c) => c.value);
  const r = await call("/api/pair/approve", { code: $("code").value, kind: found.kind, name: $("name").value, scopes });
  if (r.status !== 200) { say(r.data.error || "That didn't work.", "bad"); return; }
  say(`Paired ${r.data.device.name}. It picks up its key by itself in a moment.`, "good");
  $("request").hidden = true; $("code").value = ""; found = null;
  setTimeout(load, 1500);
}

$("find").onclick = find;
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") find(); });
$("approve").onclick = approve;
$("cancel").onclick = () => { $("request").hidden = true; found = null; say(""); };
$("use-token").onclick = () => {
  token = $("token").value.trim() || null;
  try { token ? sessionStorage.setItem("pair-token", token) : sessionStorage.removeItem("pair-token"); } catch (e) { /* private mode */ }
  $("token").value = "";
  load();
};
fetch("/.well-known/pair").then((r) => r.json()).then((w) => {
  document.title = `${w.name} · Devices`; $("title").textContent = `${w.name} · Devices`;
  serverCert = typeof w.cert_sha256 === "string" ? w.cert_sha256.toLowerCase() : null;
  showServer();
}).catch(() => showServer());
const given = new URLSearchParams(location.search).get("code");
if (given) { $("code").value = given; }
load().then(() => { if (given && $("signin").hidden) find(); });
</script>
</body>
</html>
