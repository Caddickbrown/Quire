# The iOS app. The Mac app is built by SwiftPM (./build.sh); this project exists
# because SwiftPM can't produce an iOS bundle. Both compile the same sources:
# WanderCore as a local package, Sources/Wander for the shared views and store,
# Sources/WanderiOS for the phone/iPad shell.
#
#   xcodegen generate && open Wander.xcodeproj

name: Wander
options:
  bundleIdPrefix: com.caddickbrown
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  WanderCore:
    path: .

targets:
  wander:
    type: application
    platform: iOS
    sources:
      - path: Sources/Wander
      - path: Sources/WanderiOS
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WanderCore
        product: WanderCore
    info:
      path: Resources/Info-iOS.plist
    settings:
      base:
        PRODUCT_NAME: wander
        PRODUCT_BUNDLE_IDENTIFIER: com.caddickbrown.wander
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
