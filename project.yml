# The iOS app. The Mac app is built by SwiftPM (./build.sh); this project exists
# because SwiftPM can't produce an iOS bundle. Both compile the same sources:
# WanderCore as a local package, Sources/Wander for the shared views and store,
# Sources/WanderiOS for the phone/iPad shell.
#
#   xcodegen generate && open Wander.xcodeproj

name: Wander
options:
  bundleIdPrefix: com.caddickbrown
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

# Project-level so every target inherits it, which is what Xcode's
# "Inherit Development Team from Project Settings" recommendation asks for.
settings:
  base:
    DEVELOPMENT_TEAM: 52W73J6V95
    CODE_SIGN_STYLE: Automatic
    # Xcode 16 recommendations: generate symbols for String Catalog entries,
    # but not the asset symbol extensions — the only asset here is the icon.
    LOCALIZED_STRING_SYMBOL_GENERATION: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    SWIFT_VERSION: "5.9"

packages:
  WanderCore:
    path: WanderCore

targets:
  wander (iOS):
    type: application
    platform: iOS
    sources:
      - path: Sources/Wander
      - path: Sources/WanderiOS
      - path: Resources/Assets.xcassets
      - path: Resources/themes.json
      - path: Resources/Fonts
    dependencies:
      - package: WanderCore
        product: WanderCore
    # xcodegen generates this file from the properties below — it owns the path,
    # so anything hand-written there is overwritten on the next generate.
    info:
      path: Resources/Info-iOS.plist
      properties:
        CFBundleName: wander
        CFBundleDisplayName: wander
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: wander
        PRODUCT_BUNDLE_IDENTIFIER: com.caddickbrown.wander
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The alternates AppIconSwitcher asks for by name. They live in the
        # asset catalog rather than as loose files because only a catalog can
        # carry a dark variant — loose CFBundleAlternateIcons cannot, which
        # left iOS to derive one by darkening the light art into itself.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - wander-quiet
          - wander-botanic
          - wander-manuscript
          - wander-sumi
          - wander-editorial
          - wander-broadsheet
          - wander-cinema
          - wander-seismograph
          - wander-constructivist
          - wander-bauhaus
          - wander-brutalist
          - wander-brokengrid
          - wander-memphis
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  wander (macOS):
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Wander
      - path: Resources/themes.json
      - path: Resources/Fonts
      - path: Resources/Icons
      - path: Resources/AppIcon.icns
      - path: Resources/AppIcon-light.png
      - path: Resources/AppIcon-dark.png
    dependencies:
      - package: WanderCore
        product: WanderCore
    info:
      path: Resources/Info-macOS.plist
      properties:
        CFBundleName: wander
        CFBundleDisplayName: wander
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Wander
        NSSupportsAutomaticTermination: false
    entitlements:
      path: Resources/Wander-macOS.entitlements
    settings:
      base:
        PRODUCT_NAME: wander
        PRODUCT_BUNDLE_IDENTIFIER: com.caddickbrown.wander
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
