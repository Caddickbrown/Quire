[package]
name = "quire-tui"
description = "Quire in the terminal — installed as both `quire` and `jnl`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "quire_tui"
path = "src/lib.rs"

[[bin]]
name = "quire"
path = "src/bin/quire.rs"

[[bin]]
name = "jnl"
path = "src/bin/jnl.rs"

[dependencies]
quire-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
regex.workspace = true
once_cell.workspace = true
rand = "0.9"
