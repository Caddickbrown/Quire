[package]
name = "quire-tui"
description = "Quire in the terminal — installed as both `quire` and `jnl`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "quire_tui"
path = "src/lib.rs"

[[bin]]
name = "quire"
path = "src/bin/quire.rs"

[[bin]]
name = "jnl"
path = "src/bin/jnl.rs"

[dependencies]
quire-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
regex.workspace = true
once_cell.workspace = true
rand = "0.9"
arboard.workspace = true
# `quire update`: the GitHub release API, then the tarball for this target.
ureq = { version = "3.4", features = ["json", "platform-verifier"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# A release file's .sig, against the updater's public key.
minisign-verify = "0.3"
base64 = "0.22"
# SIGHUP and SIGTERM as a flag the loop reads (crossterm already builds it).
signal-hook = "0.3"

[dev-dependencies]
tempfile.workspace = true
